[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantlab"
version = "0.1.0"
description = "A configurable backtesting and strategy research platform"
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "yfinance",
    "matplotlib",
    "typer",
    "rich",
    "pyyaml",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.0",
]

[project.scripts]
quantlab = "quantlab.cli:app"

[tool.setuptools.packages.find]
include = ["quantlab*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "UP"]